# Add this step to your GitHub Actions workflow AFTER the test step. It uses the
# FlakeRadar report action, which uploads each JUnit XML file it matches as its
# own Report and derives the run metadata (repo, commit SHA, branch, run id,
# attempt, ci_job_id, pipeline, default branch) from the runner itself, so this
# copy cannot drift when ingest gains a parameter.
# Requires: FLAKERADAR_URL (e.g. https://flakeradar.example.com) as a variable
#           or secret, and FLAKERADAR_TOKEN (your FLAKERADAR_API_TOKEN) as a secret.
# Works with any runner that produces JUnit XML reports, e.g.:
#   pytest --junitxml=junit.xml -o junit_family=xunit1   (Python; xunit1 adds file/line,
#           numbered from 0, so pytest uploads also set line_base: 0)
#   vitest --reporter=junit --outputFile=junit.xml        (JS/TS; set addFileAttribute)
#   go test ... | go-junit-report > junit.xml              (Go)
#   mvn test                                               (Java; one TEST-*.xml per class)
# One step per project: set `project` (and `root`, its directory) for each suite.
#
# On another CI system, or to make the call yourself, use the raw `curl` step in
# the README instead: see "CI integration" -> "Other CI systems".

- name: Report test results to FlakeRadar
  if: always()   # crucial — you want the FAILED runs recorded too
  uses: andrewthetechie/flakeradar/actions/report@<ref>
  with:
    url: ${{ secrets.FLAKERADAR_URL }}     # required
    token: ${{ secrets.FLAKERADAR_TOKEN }} # required
    project: backend
    root: backend
    files: |            # globs, one per line; each match is uploaded as its own Report
      junit.xml
      target/surefire-reports/TEST-*.xml
    # line_base: 0      # uncomment for pytest's junit_family=xunit1 (0-based line numbers)
    # fail-on-error: false   # reporting must not fail the build (the default)
