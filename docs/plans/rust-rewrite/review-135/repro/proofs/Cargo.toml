[package]
name = "pr135-proof"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
path = "src/lib.rs"

[dependencies]

[dev-dependencies]
flakeradar = { path = "<repo>/crates/flakeradar" }
flakeradar-core = { path = "<repo>/crates/flakeradar-core" }
flakeradar-db = { path = "<repo>/crates/flakeradar-db" }
flakeradar-test-support = { path = "<repo>/crates/flakeradar-test-support" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tower = { version = "0.5", features = ["util"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
serde_json = "1"

# The release profile leaves overflow checks off; this mirrors that for the wrap proof.
[profile.relproof]
inherits = "dev"
overflow-checks = false
debug-assertions = false
