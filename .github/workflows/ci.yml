name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Read main's coverage artifact for the PR comparison.
      actions: read
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Pinned to match local verification; ruff.toml at repo root.
      - name: Lint + format (ruff)
        run: |
          pip install ruff==0.16.9
          ruff check .
          ruff format --check .

      # Tests spin up a real Postgres 17 via testcontainers; ubuntu-latest
      # has Docker available, which testcontainers requires.
      - name: Test (pytest + testcontainers Postgres)
        run: coverage run -m pytest

      # Line + branch coverage (backend/.coveragerc). `report` fails the job
      # when the total is below `fail_under`.
      - name: Coverage report
        run: |
          coverage json -q -o coverage.json
          coverage report

      # Each push to main stores its coverage; PRs compare against it.
      - name: Upload coverage baseline (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.json
          retention-days: 90

      # Fail the PR when its total is below the newest main baseline. The suite
      # is deterministic (same total on every run), so the comparison is exact
      # at the report's two-decimal precision. Without a baseline (none uploaded
      # yet, or it expired) only the `fail_under` floor applies.
      - name: Coverage must not decrease (PRs only)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=backend-coverage&per_page=100" \
            --jq "[.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == \"$BASE_REF\")]
                  | sort_by(.created_at) | last | .workflow_run.id // empty")
          if [ -z "$run_id" ]; then
            echo "::notice::No backend-coverage baseline for $BASE_REF; only the fail_under floor applies."
            echo "Coverage: no baseline for \`$BASE_REF\` yet; only the \`fail_under\` floor applies." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n backend-coverage -D "$RUNNER_TEMP/base-coverage"
          python -I - "$RUNNER_TEMP/base-coverage/coverage.json" coverage.json "$BASE_REF" "$run_id" <<'EOF'
          import json
          import os
          import sys

          base_path, head_path, base_ref, run_id = sys.argv[1:]

          def total(path):
              with open(path) as f:
                  return round(json.load(f)["totals"]["percent_covered"], 2)

          base, head = total(base_path), total(head_path)
          table = (
              "| | Line + branch coverage |\n"
              "|---|---|\n"
              f"| `{base_ref}` (run {run_id}) | {base:.2f}% |\n"
              f"| this PR | {head:.2f}% |\n"
              f"| change | {head - base:+.2f} |\n"
          )
          print(table)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(table)
          if head < base:
              print(f"::error::Backend coverage fell from {base:.2f}% to {head:.2f}%. Add tests for the new or changed code.")
              sys.exit(1)
          EOF

  frontend:
    name: Frontend (typecheck + tests)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Read main's coverage artifact for the PR comparison.
      actions: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format:check

      # CI is set on GitHub runners, so this also measures coverage (v8) and
      # fails below the thresholds in frontend/vite.config.ts.
      - name: Test (vitest + jsdom + coverage)
        run: npm test

      # Each push to main stores its coverage; PRs compare against it.
      - name: Upload coverage baseline (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/test-results/coverage/coverage-summary.json
          retention-days: 90

      # Fail the PR when any of statements, branches, functions or lines is
      # below the newest main baseline. The suite gives the same figures on
      # every run, so the comparison is exact (two decimals). Without a
      # baseline (none uploaded yet, or it expired) only the thresholds apply.
      - name: Coverage must not decrease (PRs only)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=frontend-coverage&per_page=100" \
            --jq "[.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == \"$BASE_REF\")]
                  | sort_by(.created_at) | last | .workflow_run.id // empty")
          if [ -z "$run_id" ]; then
            echo "::notice::No frontend-coverage baseline for $BASE_REF; only the thresholds apply."
            echo "Frontend coverage: no baseline for \`$BASE_REF\` yet; only the thresholds apply." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n frontend-coverage -D "$RUNNER_TEMP/base-coverage"
          node --input-type=commonjs - "$RUNNER_TEMP/base-coverage/coverage-summary.json" test-results/coverage/coverage-summary.json "$BASE_REF" "$run_id" <<'EOF'
          const fs = require("node:fs");
          const [basePath, headPath, baseRef, runId] = process.argv.slice(2);
          const total = (p) => JSON.parse(fs.readFileSync(p, "utf8")).total;
          const base = total(basePath);
          const head = total(headPath);
          const metrics = ["statements", "branches", "functions", "lines"];
          const pct = (t, m) => Math.round(t[m].pct * 100) / 100;
          let table = `| Frontend coverage | \`${baseRef}\` (run ${runId}) | this PR | change |\n|---|---|---|---|\n`;
          const fell = [];
          for (const m of metrics) {
            const b = pct(base, m);
            const h = pct(head, m);
            const d = h - b;
            table += `| ${m} | ${b.toFixed(2)}% | ${h.toFixed(2)}% | ${d >= 0 ? "+" : ""}${d.toFixed(2)} |\n`;
            if (h < b) fell.push(`${m} ${b.toFixed(2)}% -> ${h.toFixed(2)}%`);
          }
          console.log(table);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, table);
          if (fell.length) {
            console.log(`::error::Frontend coverage fell: ${fell.join(", ")}. Add tests for the new or changed code.`);
            process.exit(1);
          }
          EOF

  # Exercises the standalone summary action (issue #36) end to end: a real
  # backend plus a fixture CI run (one known-flaky Test, one new failure), then
  # asserts on the Markdown the action writes. The reporter (#35) is not in the
  # tree yet, so this job seeds the /api/ci-runs/{id}/failures data directly
  # through the models and runs the action against it.
  summary-action:
    name: Summary action (fixture)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: flakeradar
          POSTGRES_PASSWORD: flakeradar
          POSTGRES_DB: flakeradar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flakeradar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FLAKERADAR_DATABASE_URL: postgresql+asyncpg://flakeradar:flakeradar@localhost:5432/flakeradar
      FLAKERADAR_ALLOW_INSECURE: "1"
      FLAKERADAR_API_TOKEN: flakeradar-test-token
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Start the backend (migrations run on startup)
        run: |
          cd backend
          python -m alembic upgrade head
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 >/tmp/uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/health

      - name: Seed the fixture (one known-flaky Test, one new failure)
        run: python actions/summary/test/seed_fixture.py
        env:
          CI_RUN_ID: "12345"
          CI_RUN_ATTEMPT: "1"
          CI_JOB_ID: "999"

      - name: Run the summary action against the fixture
        uses: ./actions/summary
        with:
          url: http://127.0.0.1:8000
          token: flakeradar-test-token
          repo: andrewthetechie/flakeradar
          ci_run_id: "12345"
          ci_run_attempt: "1"
          ci_job_id: "999"
          summary-timeout: "30"
          dashboard-url: https://flakeradar.example.com
          # The action appends the same Markdown it writes to $GITHUB_STEP_SUMMARY
          # here too, so the next step can assert on a stable path.
          summary-file: ${{ github.workspace }}/summary.md

      - name: Check the job summary content
        run: |
          # dashboard-url links each Test, so the names appear inside Markdown links.
          grep -Fq "1 of 2 failures are known flaky tests" summary.md
          grep -Fq "[test_known_flaky](https://flakeradar.example.com?repo=andrewthetechie%2Fflakeradar&test=" summary.md
          grep -Fq "| flaky (0.9) | 3 | no |" summary.md
          grep -Fq "[test_new_failure](https://flakeradar.example.com?repo=andrewthetechie%2Fflakeradar&test=" summary.md
          grep -Fq "| stable (0) | 0 | no |" summary.md
          echo "::notice::Summary action output verified: one known-flaky and one new failure rendered."
