name: CI

on:
  push:
    # `feat/rust-rewrite` is here so the Rust rewrite branch gets CI with no PR
    # open. Task 15 (cutover) removes it, in the same PR that deletes backend/.
    branches: [main, feat/rust-rewrite]
  pull_request:

# Every push to a PR head re-triggers this workflow through `pull_request:
# synchronize`, and only the newest commit's result is read, so superseded PR
# runs are cancelled. Pushes are never cancelled: a push to `main` is the
# release path, and a push to `feat/rust-rewrite` is one task's whole result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Warnings are errors, so a lint that fires on a newer toolchain cannot pass
  # unnoticed. The coverage job clears it; see that job.
  RUSTFLAGS: "-D warnings"

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Read main's coverage artifact for the PR comparison.
      actions: read
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Pinned to match local verification; ruff.toml at repo root.
      - name: Lint + format (ruff)
        run: |
          pip install ruff==0.16.9
          ruff check .
          ruff format --check .

      # Tests spin up a real Postgres 17 via testcontainers; ubuntu-latest
      # has Docker available, which testcontainers requires.
      - name: Test (pytest + testcontainers Postgres)
        run: coverage run -m pytest

      # Line + branch coverage (backend/.coveragerc). `report` fails the job
      # when the total is below `fail_under`.
      - name: Coverage report
        run: |
          coverage json -q -o coverage.json
          coverage report

      # Each push to main stores its coverage; PRs compare against it.
      - name: Upload coverage baseline (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.json
          retention-days: 90

      # Fail the PR when its total is below the newest main baseline. The suite
      # is deterministic (same total on every run), so the comparison is exact
      # at the report's two-decimal precision. Without a baseline (none uploaded
      # yet, or it expired) only the `fail_under` floor applies.
      - name: Coverage must not decrease (PRs only)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=backend-coverage&per_page=100" \
            --jq "[.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == \"$BASE_REF\")]
                  | sort_by(.created_at) | last | .workflow_run.id // empty")
          if [ -z "$run_id" ]; then
            echo "::notice::No backend-coverage baseline for $BASE_REF; only the fail_under floor applies."
            echo "Coverage: no baseline for \`$BASE_REF\` yet; only the \`fail_under\` floor applies." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n backend-coverage -D "$RUNNER_TEMP/base-coverage"
          python -I - "$RUNNER_TEMP/base-coverage/coverage.json" coverage.json "$BASE_REF" "$run_id" <<'EOF'
          import json
          import os
          import sys

          base_path, head_path, base_ref, run_id = sys.argv[1:]

          def total(path):
              with open(path) as f:
                  return round(json.load(f)["totals"]["percent_covered"], 2)

          base, head = total(base_path), total(head_path)
          table = (
              "| | Line + branch coverage |\n"
              "|---|---|\n"
              f"| `{base_ref}` (run {run_id}) | {base:.2f}% |\n"
              f"| this PR | {head:.2f}% |\n"
              f"| change | {head - base:+.2f} |\n"
          )
          print(table)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(table)
          if head < base:
              print(f"::error::Backend coverage fell from {base:.2f}% to {head:.2f}%. Add tests for the new or changed code.")
              sys.exit(1)
          EOF

  rust:
    name: Rust (fmt + clippy + test + audit)
    runs-on: ubuntu-24.04
    env:
      # Pinned so the cached binary is replaced when this is bumped.
      CARGO_AUDIT_VERSION: 0.22.2
      # Pinned to the sea-orm version the workspace depends on.
      SEA_ORM_CLI_VERSION: 2.0.4
      # Nextest starts its own Postgres only when this is unset; CI points the
      # suite at the service below instead, so no Docker is needed.
      FLAKERADAR_TEST_DATABASE_URL: postgresql://flakeradar:flakeradar@localhost:5432/flakeradar
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: flakeradar
          POSTGRES_PASSWORD: flakeradar
          POSTGRES_DB: flakeradar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flakeradar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "cargo"

      - name: Check formatting (rustfmt)
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Install cargo-nextest
        # The taiki-e action pulls the prebuilt binary off the release URLs.
        uses: taiki-e/install-action@nextest

      - name: Run tests (cargo nextest)
        # --profile ci activates [profile.ci] (retries, flaky handling) and writes
        # the JUnit report to target/nextest/ci/junit.xml. The workspace has tests
        # from task 03 on, so an empty run is a failure, not a pass.
        run: cargo nextest run --all-features --profile ci

      - name: Run doctests (cargo test --doc)
        # nextest does not run doctests, so without this step a stale example in
        # a doc comment can pass CI forever.
        run: cargo test --doc --all-features

      - name: Cache sea-orm-cli binary
        id: cache-sea-orm-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/sea-orm-cli
          key: sea-orm-cli-${{ runner.os }}-${{ env.SEA_ORM_CLI_VERSION }}

      - name: Install sea-orm-cli
        if: steps.cache-sea-orm-cli.outputs.cache-hit != 'true'
        run: cargo install sea-orm-cli --version "$SEA_ORM_CLI_VERSION" --locked

      - name: Check the entities match the migrated schema
        # The entities are generated from a migrated database, so a baseline change
        # that the committed entities do not reflect fails here instead of surfacing
        # as a query that names a column the schema no longer has.
        run: |
          cargo run -q -p flakeradar-db --example migrate -- "$FLAKERADAR_TEST_DATABASE_URL"
          sea-orm-cli generate entity \
            --database-url "$FLAKERADAR_TEST_DATABASE_URL" \
            --output-dir crates/flakeradar-db/src/entities \
            --with-prelude none
          git diff --exit-code -- crates/flakeradar-db/src/entities

      - name: Upload JUnit test report
        # if-no-files-found: error turns a missing report into a visible CI
        # failure rather than silently succeeding without an artifact.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-rust
          path: target/nextest/ci/junit.xml
          if-no-files-found: error

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the pytest manifest checker
        run: node --test scripts/check-test-manifest.test.mjs

      - name: Check the pytest manifest
        # It reads the highest task marked Done in STATUS.md: every pending row
        # of a landed task, every `na` row without a reason and every `ported`
        # row naming a test nextest does not know fails this step.
        run: node scripts/check-test-manifest.mjs

      - name: Cache cargo-audit binary
        id: cache-audit
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ env.CARGO_AUDIT_VERSION }}

      - name: Install cargo-audit
        if: steps.cache-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked

      - name: Compute advisory database cache day
        id: advisory-day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Cache RustSec advisory database
        # Restores the newest clone; `cargo audit` then fetches only the new
        # commits instead of cloning the whole database. Saved once a day.
        uses: actions/cache@v4
        with:
          path: ~/.cargo/advisory-db
          key: advisory-db-${{ steps.advisory-day.outputs.day }}
          restore-keys: advisory-db-

      - name: Run cargo audit
        run: cargo audit

  coverage:
    name: Rust coverage (lines + branches)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Read main's coverage artifact for the PR comparison.
      actions: read
    env:
      # Pinned nightly; bump deliberately, then re-check the floors.
      COVERAGE_TOOLCHAIN: nightly-2026-10-25
      # Warnings are already a hard gate in the `rust` job. Unset the
      # workflow-wide `-D warnings` here so a new nightly-only lint cannot fail
      # coverage; cargo-llvm-cov adds its own instrumentation flags.
      RUSTFLAGS: ""
      FLAKERADAR_TEST_DATABASE_URL: postgresql://flakeradar:flakeradar@localhost:5432/flakeradar
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: flakeradar
          POSTGRES_PASSWORD: flakeradar
          POSTGRES_DB: flakeradar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flakeradar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the coverage toolchain
        # Installed by name and invoked as `cargo +$COVERAGE_TOOLCHAIN`, never
        # made the rustup default, so the stable build stays the default.
        run: rustup toolchain install "$COVERAGE_TOOLCHAIN" --profile minimal -c llvm-tools-preview

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # Separate key: the instrumented nightly build shares nothing with the
          # stable build and would only evict it.
          prefix-key: "cargo-cov-nightly"

      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-nextest

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests with coverage
        # --no-report: collect once, then export each format from the same data.
        run: cargo "+$COVERAGE_TOOLCHAIN" llvm-cov nextest --branch --all-features --profile ci --no-report

      - name: Export coverage reports
        run: |
          cargo "+$COVERAGE_TOOLCHAIN" llvm-cov report --branch --lcov --output-path lcov.info
          cargo "+$COVERAGE_TOOLCHAIN" llvm-cov report --branch --json --summary-only --output-path coverage-summary.json
          cargo "+$COVERAGE_TOOLCHAIN" llvm-cov report --branch --summary-only

      - name: Test the coverage gate script
        run: node --test scripts/coverage-gate.test.mjs

      - name: Check coverage floors and no decrease
        # Writes the totals and the worst files to the job summary, and fails if
        # line or branch coverage is below `coverage-floor.json`. On a PR it also
        # fails when a total fell below the newest coverage that the base branch
        # uploaded, compared at two decimals with no tolerance.
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          baseline=""
          if [ -n "$BASE_REF" ]; then
            run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=rust-coverage&per_page=100" \
              --jq "[.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == \"$BASE_REF\")]
                    | sort_by(.created_at) | last | .workflow_run.id // empty")
            if [ -z "$run_id" ]; then
              echo "::notice::No rust-coverage baseline for $BASE_REF; only the floors apply."
              echo "Rust coverage: no baseline for \`$BASE_REF\` yet; only the floors apply." >> "$GITHUB_STEP_SUMMARY"
            else
              gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n rust-coverage -D "$RUNNER_TEMP/base-coverage"
              baseline="$RUNNER_TEMP/base-coverage/coverage-summary.json"
            fi
          fi
          if [ -n "$baseline" ]; then
            node scripts/coverage-gate.mjs coverage-summary.json --baseline "$baseline"
          else
            node scripts/coverage-gate.mjs coverage-summary.json
          fi

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-rust
          path: |
            lcov.info
            coverage-summary.json
          if-no-files-found: warn

      # Each push to main stores its coverage; PRs compare against it.
      - name: Upload coverage baseline (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: coverage-summary.json
          if-no-files-found: warn
          retention-days: 90

  # Always runs, on every push and PR, so a version drift is caught before it can
  # reach a release. Needs only checkout and Node.
  version-consistency:
    name: Release version consistency
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the version script
        run: node --test scripts/version.test.mjs

      - name: Check release version consistency
        run: node scripts/version.mjs check

  frontend:
    name: Frontend (typecheck + tests)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Read main's coverage artifact for the PR comparison.
      actions: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format:check

      # CI is set on GitHub runners, so this also measures coverage (v8) and
      # fails below the thresholds in frontend/vite.config.ts.
      - name: Test (vitest + jsdom + coverage)
        run: npm test

      # Each push to main stores its coverage; PRs compare against it.
      - name: Upload coverage baseline (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/test-results/coverage/coverage-summary.json
          retention-days: 90

      # Fail the PR when any of statements, branches, functions or lines is
      # below the newest main baseline. The suite gives the same figures on
      # every run, so the comparison is exact (two decimals). Without a
      # baseline (none uploaded yet, or it expired) only the thresholds apply.
      - name: Coverage must not decrease (PRs only)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=frontend-coverage&per_page=100" \
            --jq "[.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == \"$BASE_REF\")]
                  | sort_by(.created_at) | last | .workflow_run.id // empty")
          if [ -z "$run_id" ]; then
            echo "::notice::No frontend-coverage baseline for $BASE_REF; only the thresholds apply."
            echo "Frontend coverage: no baseline for \`$BASE_REF\` yet; only the thresholds apply." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n frontend-coverage -D "$RUNNER_TEMP/base-coverage"
          node --input-type=commonjs - "$RUNNER_TEMP/base-coverage/coverage-summary.json" test-results/coverage/coverage-summary.json "$BASE_REF" "$run_id" <<'EOF'
          const fs = require("node:fs");
          const [basePath, headPath, baseRef, runId] = process.argv.slice(2);
          const total = (p) => JSON.parse(fs.readFileSync(p, "utf8")).total;
          const base = total(basePath);
          const head = total(headPath);
          const metrics = ["statements", "branches", "functions", "lines"];
          const pct = (t, m) => Math.round(t[m].pct * 100) / 100;
          let table = `| Frontend coverage | \`${baseRef}\` (run ${runId}) | this PR | change |\n|---|---|---|---|\n`;
          const fell = [];
          for (const m of metrics) {
            const b = pct(base, m);
            const h = pct(head, m);
            const d = h - b;
            table += `| ${m} | ${b.toFixed(2)}% | ${h.toFixed(2)}% | ${d >= 0 ? "+" : ""}${d.toFixed(2)} |\n`;
            if (h < b) fell.push(`${m} ${b.toFixed(2)}% -> ${h.toFixed(2)}%`);
          }
          console.log(table);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, table);
          if (fell.length) {
            console.log(`::error::Frontend coverage fell: ${fell.join(", ")}. Add tests for the new or changed code.`);
            process.exit(1);
          }
          EOF

  # Builds the binary once and hands it to the jobs that exercise the shipped
  # interfaces, exactly as a user downloads it. `frontend/dist` is not built
  # here, so this binary serves the API only: every job below uses `/api`, and
  # the packaging jobs in `release.yml` are what prove the full binary.
  binary:
    name: Binary (release)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "cargo"

      - name: Build the release binary
        run: cargo build --release --locked

      - name: Upload the binary
        uses: actions/upload-artifact@v4
        with:
          name: flakeradar-linux-x86_64
          path: target/release/flakeradar
          if-no-files-found: error

  # The `actions/report` composite action on its two fixtures, against the real
  # binary: one Report per matched file, every one of them processed. This is
  # the CI half of what `backend/tests/test_report_action.py` used to prove.
  report-action:
    name: Report action (fixtures)
    needs: binary
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: flakeradar
          POSTGRES_PASSWORD: flakeradar
          POSTGRES_DB: flakeradar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flakeradar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FLAKERADAR_DATABASE_URL: postgresql://flakeradar:flakeradar@localhost:5432/flakeradar
      FLAKERADAR_ALLOW_INSECURE: "1"
      FLAKERADAR_API_TOKEN: flakeradar-test-token
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the binary
        uses: actions/download-artifact@v4
        with:
          name: flakeradar-linux-x86_64
          path: ${{ runner.temp }}/bin

      - name: Start FlakeRadar
        run: |
          chmod +x "$RUNNER_TEMP/bin/flakeradar"
          "$RUNNER_TEMP/bin/flakeradar" >/tmp/flakeradar.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/api/health/ready >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/health/ready

      - name: Run the report action on both fixtures
        id: report
        uses: ./actions/report
        with:
          url: http://127.0.0.1:8000
          token: flakeradar-test-token
          project: fixtures
          files: |
            actions/report/test/fixture-alpha.xml
            actions/report/test/fixture-beta.xml

      - name: One Report per fixture, and every one of them processed
        run: |
          ids="${{ steps.report.outputs.report_ids }}"
          count=$(printf '%s' "$ids" | awk -F, '{print NF}')
          if [ "$count" -ne 2 ]; then
            echo "::error::expected one Report per fixture, got report_ids='$ids'"
            exit 1
          fi
          IFS=, read -r first second <<< "$ids"
          for id in "$first" "$second"; do
            for i in $(seq 1 60); do
              body=$(curl -fsS -H "X-API-Key: $FLAKERADAR_API_TOKEN" \
                "http://127.0.0.1:8000/api/reports/$id")
              status=$(printf '%s' "$body" | jq -r .status)
              [ "$status" = "pending" ] || break
              sleep 1
            done
            if [ "$status" != "processed" ]; then
              echo "::error::Report $id ended $status, not processed: $body"
              exit 1
            fi
            echo "$body" | jq -r '"Report \(.id) \(.status): \(.counts)"'
          done
          echo "::notice::Both fixtures became processed Reports."

  # Exercises the standalone summary action (issue #36) end to end against the
  # real binary: the Reports are seeded through the `actions/report` action
  # rather than through the models, so the action reads data a reporter wrote.
  # `test_known_flaky` passes and fails on three commits, which is three Proven
  # flakes and the flaky tier; `test_new_failure` fails once, in the fixture CI
  # run. The values grepped below are the ones this pipeline produces, measured
  # on the binary (flaky 0.8, three proven flakes).
  summary-action:
    name: Summary action (fixture)
    needs: binary
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: flakeradar
          POSTGRES_PASSWORD: flakeradar
          POSTGRES_DB: flakeradar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flakeradar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FLAKERADAR_DATABASE_URL: postgresql://flakeradar:flakeradar@localhost:5432/flakeradar
      FLAKERADAR_ALLOW_INSECURE: "1"
      FLAKERADAR_API_TOKEN: flakeradar-test-token
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the binary
        uses: actions/download-artifact@v4
        with:
          name: flakeradar-linux-x86_64
          path: ${{ runner.temp }}/bin

      - name: Start FlakeRadar
        run: |
          chmod +x "$RUNNER_TEMP/bin/flakeradar"
          "$RUNNER_TEMP/bin/flakeradar" >/tmp/flakeradar.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/api/health/ready >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/health/ready

      # Three commits, each with a pass and a fail for the same Test: this is
      # the Proven flake the summary action should recognise. The metadata comes
      # from the runner, which these steps set per upload.
      - name: Seed commit aaa111
        uses: ./actions/report
        env:
          GITHUB_SHA: aaa111
          GITHUB_REF_NAME: main
          GITHUB_RUN_ID: "1001"
          GITHUB_RUN_ATTEMPT: "1"
        with:
          url: http://127.0.0.1:8000
          token: flakeradar-test-token
          project: summary
          files: |
            actions/summary/test/fixture-known-flaky-pass.xml
            actions/summary/test/fixture-known-flaky-fail.xml

      - name: Seed commit bbb222
        uses: ./actions/report
        env:
          GITHUB_SHA: bbb222
          GITHUB_REF_NAME: main
          GITHUB_RUN_ID: "1002"
          GITHUB_RUN_ATTEMPT: "1"
        with:
          url: http://127.0.0.1:8000
          token: flakeradar-test-token
          project: summary
          files: |
            actions/summary/test/fixture-known-flaky-pass.xml
            actions/summary/test/fixture-known-flaky-fail.xml

      - name: Seed commit ccc333
        uses: ./actions/report
        env:
          GITHUB_SHA: ccc333
          GITHUB_REF_NAME: main
          GITHUB_RUN_ID: "1003"
          GITHUB_RUN_ATTEMPT: "1"
        with:
          url: http://127.0.0.1:8000
          token: flakeradar-test-token
          project: summary
          files: |
            actions/summary/test/fixture-known-flaky-pass.xml
            actions/summary/test/fixture-known-flaky-fail.xml

      # The fixture CI run: the known-flaky Test fails again, and a Test nobody
      # has seen fail before fails for the first time.
      - name: Seed the fixture CI run (12345)
        uses: ./actions/report
        env:
          GITHUB_SHA: ccc333
          GITHUB_REF_NAME: main
          GITHUB_RUN_ID: "12345"
          GITHUB_RUN_ATTEMPT: "1"
        with:
          url: http://127.0.0.1:8000
          token: flakeradar-test-token
          project: summary
          files: actions/summary/test/fixture-run-failures.xml

      - name: Run the summary action against the fixture
        uses: ./actions/summary
        with:
          url: http://127.0.0.1:8000
          token: flakeradar-test-token
          repo: andrewthetechie/flakeradar
          ci_run_id: "12345"
          ci_run_attempt: "1"
          ci_job_id: ${{ job.check_run_id }}
          summary-timeout: "60"
          dashboard-url: https://flakeradar.example.com
          # The action appends the same Markdown it writes to $GITHUB_STEP_SUMMARY
          # here too, so the next step can assert on a stable path.
          summary-file: ${{ github.workspace }}/summary.md

      - name: Check the job summary content
        run: |
          # dashboard-url links each Test, so the names appear inside Markdown links.
          grep -Fq "1 of 2 failures are known flaky tests" summary.md
          grep -Fq "[test_known_flaky](https://flakeradar.example.com?repo=andrewthetechie%2Fflakeradar&test=" summary.md
          grep -Fq "| flaky (0.8) | 3 | no |" summary.md
          grep -Fq "[test_new_failure](https://flakeradar.example.com?repo=andrewthetechie%2Fflakeradar&test=" summary.md
          grep -Fq "| stable (0) | 0 | no |" summary.md
          echo "::notice::Summary action output verified: one known-flaky and one new failure rendered."

  # The two samples against the real binary: the GitLab reporter's payload is
  # accepted by `/api/ingest/pipeline`, and `simulate_ci.py`'s demo history is
  # visible through the read APIs. Needs pytest, httpx and the standard library,
  # not the backend's requirements.
  samples:
    name: Samples (GitLab reporter + demo data)
    needs: binary
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: flakeradar
          POSTGRES_PASSWORD: flakeradar
          POSTGRES_DB: flakeradar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flakeradar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FLAKERADAR_DATABASE_URL: postgresql://flakeradar:flakeradar@localhost:5432/flakeradar
      FLAKERADAR_ALLOW_INSECURE: "1"
      FLAKERADAR_API_TOKEN: flakeradar-test-token
      FLAKERADAR_URL: http://127.0.0.1:8000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # The GitLab reporter sample is standard library only, and its test
          # needs nothing but pytest; the demo simulator reads its results over
          # httpx.
          python-version: "3.12"

      - name: Install the sample test's two dependencies
        run: pip install pytest httpx

      - name: Download the binary
        uses: actions/download-artifact@v4
        with:
          name: flakeradar-linux-x86_64
          path: ${{ runner.temp }}/bin

      - name: Start FlakeRadar
        run: |
          chmod +x "$RUNNER_TEMP/bin/flakeradar"
          "$RUNNER_TEMP/bin/flakeradar" >/tmp/flakeradar.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf "$FLAKERADAR_URL/api/health/ready" >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS "$FLAKERADAR_URL/api/health/ready"

      - name: The GitLab reporter's payload is accepted by the real endpoint
        run: |
          FLAKERADAR_TOKEN="$FLAKERADAR_API_TOKEN" \
            python -m pytest samples/gitlab/test_report_pipeline.py -q

      - name: The demo history is visible through the read APIs
        run: |
          python samples/simulate_ci.py "$FLAKERADAR_URL" "$FLAKERADAR_API_TOKEN"
          key=(-H "X-API-Key: $FLAKERADAR_API_TOKEN")
          tests=$(curl -fsS "${key[@]}" "$FLAKERADAR_URL/api/tests?repo=demo%2Fshop&include_stable=true")
          jobs=$(curl -fsS "${key[@]}" "$FLAKERADAR_URL/api/jobs?repo=demo%2Fshop&include_stable=true")
          [ "$(printf '%s' "$tests" | jq -r .total)" -eq 10 ] || { echo "::error::expected 10 demo Tests: $tests"; exit 1; }
          [ "$(printf '%s' "$jobs" | jq -r .total)" -eq 4 ] || { echo "::error::expected 4 demo Jobs: $jobs"; exit 1; }
          # The demo history is built to prove the two scoring rules: a Test that
          # flips on one SHA, and an infrastructure Job with no failing Test.
          printf '%s' "$tests" | jq -e '[.items[] | select(.tier == "flaky")] | length >= 2' >/dev/null \
            || { echo "::error::the demo Tests carry no flaky rows: $tests"; exit 1; }
          printf '%s' "$jobs" | jq -e '[.items[] | select(.tier == "flaky")] | length >= 1' >/dev/null \
            || { echo "::error::the demo Jobs carry no flaky row: $jobs"; exit 1; }
          echo "::notice::The demo history is visible: 10 Tests and 4 Jobs in demo/shop."

  # Paths the five-target matrix depends on. The matrix is the slowest thing CI
  # runs, so a PR that touches none of these does not pay for it; every push to
  # the rewrite branch and to main builds it regardless (see the `if` on the
  # matrix). `dorny/paths-filter` is what writers-app uses for the same reason.
  changes:
    name: Changed paths
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            relevant:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'clippy.toml'
              - '.cargo/**'
              - '.config/**'
              - 'frontend/**'
              - 'scripts/**'
              - 'tests/parity/**'
              - 'actions/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
              - 'Dockerfile'

  # Built once and handed to every matrix leg: the binary embeds `frontend/dist`,
  # and building a Vite project five times would dominate the matrix.
  frontend-dist:
    name: Frontend build
    needs: changes
    if: >-
      always() && (github.event_name != 'pull_request' ||
      needs.changes.outputs.relevant == 'true')
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  # A real binary for each target, run against a real database: the smoke test
  # starts it, uploads a Report, waits for the processor and checks every surface
  # the binary carries. Building natively on each runner means no cross toolchain
  # and no emulation.
  targets:
    name: Target (${{ matrix.target }})
    needs: [changes, frontend-dist]
    if: >-
      always() && (github.event_name != 'pull_request' ||
      needs.changes.outputs.relevant == 'true') &&
      needs.frontend-dist.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            binary: flakeradar
            rustflags: "-D warnings"
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            binary: flakeradar
            rustflags: "-D warnings"
          - target: x86_64-apple-darwin
            os: macos-15-intel
            binary: flakeradar
            rustflags: "-D warnings"
          - target: aarch64-apple-darwin
            os: macos-15
            binary: flakeradar
            rustflags: "-D warnings"
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: flakeradar.exe
            # Static CRT, so the binary needs no Visual C++ redistributable.
            rustflags: "-D warnings -C target-feature=+crt-static"
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      FLAKERADAR_TEST_DATABASE_URL: postgresql://flakeradar:flakeradar@localhost:5432/flakeradar
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the built frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Add the target
        run: rustup target add ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Point the C compiler at musl
        # `ring` and `mimalloc` build C, and the host gcc produces glibc objects
        # that do not link into a musl binary. `musl-gcc` and `ar` come with
        # musl-tools; `cc` reads the per-target variables.
        if: contains(matrix.target, 'linux-musl')
        run: |
          target_lower=$(printf '%s' "${{ matrix.target }}" | tr 'a-z-' 'a-z_')
          echo "CC_${target_lower}=musl-gcc" >> "$GITHUB_ENV"
          echo "AR_${target_lower}=ar" >> "$GITHUB_ENV"
          target_upper=$(printf '%s' "${{ matrix.target }}" | tr 'a-z-' 'A-Z_')
          echo "CARGO_TARGET_${target_upper}_LINKER=musl-gcc" >> "$GITHUB_ENV"

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "cargo-target-${{ matrix.target }}"
          key: ${{ matrix.target }}

      - name: Test the core crate
        run: cargo test -p flakeradar-core

      - name: Build the binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Check the Linux binary is static
        if: contains(matrix.target, 'linux-musl')
        # `rustc` links the x86_64 musl target as a static PIE, which `file`
        # calls `static-pie linked`; the aarch64 musl target is plain static and
        # reads `statically linked`. Both have no dynamic loader and no shared
        # library, which is the property under test, so both spellings pass and
        # a dynamically linked binary still fails either check.
        run: |
          binary="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          file "$binary"
          file "$binary" | grep -Eq "statically linked|static-pie linked" || {
            echo "::error::$binary is not statically linked"; exit 1;
          }
          ldd "$binary" 2>&1 | grep -Eq "not a dynamic executable|statically linked" || {
            echo "::error::$binary has dynamic dependencies"; exit 1;
          }

      - name: Set up PostgreSQL
        uses: ikalnytskyi/action-setup-postgres@v8
        with:
          username: flakeradar
          password: flakeradar
          database: flakeradar
          port: 5432
          postgres-version: "17"

      - name: Smoke test the binary
        shell: bash
        run: |
          scripts/smoke.sh "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
            "$FLAKERADAR_TEST_DATABASE_URL"

      - name: Upload the binary
        uses: actions/upload-artifact@v4
        with:
          name: flakeradar-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 7
