[package]
name = "flakeradar-test-support"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Test databases and factories for FlakeRadar (dev-dependency only)"
publish = false

[lints]
workspace = true

[dependencies]
chrono = { workspace = true, features = ["clock", "std"] }
flakeradar-db = { path = "../flakeradar-db" }
sea-orm = { workspace = true, features = [
  "macros",
  "runtime-tokio-rustls",
  "sqlx-postgres",
  "with-chrono",
  "with-json",
] }
sha1 = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt", "time"] }
