[package]
name = "flakeradar-test-support"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Test databases and factories for FlakeRadar (dev-dependency only)"
publish = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true, features = ["clock", "std"] }
flakeradar.workspace = true
flakeradar-core.workspace = true
flakeradar-db.workspace = true
sea-orm = { workspace = true, features = [
  "macros",
  "runtime-tokio-rustls",
  "sqlx-postgres",
  "with-chrono",
  "with-json",
] }
serde_json = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tower = { workspace = true, features = ["util"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt"] }
tokio = { workspace = true, features = ["macros", "net", "rt", "time"] }
