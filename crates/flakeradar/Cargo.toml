[package]
name = "flakeradar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Self-hosted flaky-test and flaky-job detection"
publish = false

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["http1", "json", "macros", "query", "tokio", "tracing"] }
chrono = { workspace = true, features = ["clock", "std"] }
clap = { workspace = true, features = ["derive", "error-context", "help", "std", "suggestions", "usage"] }
dotenvy.workspace = true
flakeradar-core.workspace = true
flakeradar-db.workspace = true
form_urlencoded.workspace = true
memchr = { workspace = true, features = ["std"] }
mime_guess.workspace = true
reqwest = { workspace = true, features = ["json", "rustls"] }
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server"] }
rust-embed = { workspace = true, features = ["debug-embed"] }
sea-orm.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_path_to_error.workspace = true
serde_urlencoded.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal"] }
tower-http = { workspace = true, features = ["cors", "trace"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
utoipa = { workspace = true, features = ["macros"] }
utoipa-redoc.workspace = true

[target.'cfg(all(target_os = "linux", target_env = "musl"))'.dependencies]
mimalloc.workspace = true

[dev-dependencies]
chrono = { workspace = true, features = ["clock", "std"] }
clap.workspace = true
flakeradar-test-support.workspace = true
futures-util.workspace = true
# The MCP client half of the SDK, for the one test that drives `/mcp/` with a
# real client. It stays out of `[dependencies]`: the binary serves and never
# calls out as an MCP client.
rmcp = { workspace = true, features = [
    "client",
    "transport-streamable-http-client-reqwest",
] }
tokio = { workspace = true, features = ["io-util", "test-util", "time"] }
tower = { workspace = true, features = ["util"] }
wiremock.workspace = true
