[package]
name = "flakeradar-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FlakeRadar scoring and DTOs, with no database and no network"
publish = false

[lints]
workspace = true

[dependencies]
chrono = { workspace = true, features = ["serde", "std"] }
encoding_rs = { workspace = true, features = ["alloc"] }
regex = { workspace = true, features = ["std", "unicode"] }
roxmltree = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["std"] }
sha1 = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
utoipa = { workspace = true, features = ["chrono", "macros"] }
