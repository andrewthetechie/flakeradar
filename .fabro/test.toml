version = 1

# The Rust suite starts a PostgreSQL container with the `docker` command line
# only when FLAKERADAR_TEST_DATABASE_URL is unset. The sandbox has no Docker, so
# the suite is pointed at a server on localhost instead: the image's own
# PostgreSQL where it carries one, and the server .fabro/setup.sh installs
# otherwise. SQLx reads a plain `postgresql://` URL; the driver suffix Python
# needed is not part of it.
[env]
FLAKERADAR_TEST_DATABASE_URL = "postgresql://test:test@localhost:5432/test"

[prepare]
inputs = []
timeout = 300
# Idempotent: it uses the image's `fabro-pg-ensure` wherever that exists, and
# otherwise starts the installed server and creates the role and database of the
# URL above.
run = ["bash .fabro/ensure-postgres.sh"]

[targets.rust]
about = "cargo nextest across the workspace; pass test binaries or test names"
run = "cargo nextest run --all-features --profile ci"
watch = ["crates/**", "Cargo.toml", "Cargo.lock"]
# 600 is the most fabro-io accepts for any timeout here (TIMEOUT_MAX_S), and one
# value above it fails the whole file. ci.sh runs the full suite without this cap.
timeout = 600

[targets.frontend]
about = "frontend vitest unit suite; pass test files, relative to frontend/"
cwd = "frontend"
run = "npx vitest run"
tests = ["frontend/src/**"]
timeout = 300

[checks.fmt]
about = "rustfmt (ci.sh's cargo fmt --all -- --check)"
run = "cargo fmt --all -- --check"
watch = ["crates/**", "Cargo.toml"]
files = false

[checks.clippy]
about = "clippy with warnings as errors (ci.sh's clippy step)"
run = "cargo clippy --all-targets --all-features -- -D warnings"
watch = ["crates/**", "Cargo.toml", "Cargo.lock"]
files = false
timeout = 600

[checks.typecheck]
about = "frontend TypeScript type check (npm run typecheck)"
cwd = "frontend"
run = "npm run typecheck"
watch = ["frontend/**"]
files = false
timeout = 300
