version = 1

# The Rust suite starts a PostgreSQL container with the `docker` command line
# only when FLAKERADAR_TEST_DATABASE_URL is unset. The sandbox has no Docker, so
# the image's own PostgreSQL (fabro-pg-ensure) is reached over localhost instead.
# SQLx reads a plain `postgresql://` URL; the driver suffix Python needed is not
# part of it.
[env]
FLAKERADAR_TEST_DATABASE_URL = "postgresql://test:test@localhost:5432/test"

[prepare]
inputs = []
timeout = 300
# Recreates the test databases on every call.
run = ["fabro-pg-ensure"]

[targets.rust]
about = "cargo nextest across the workspace; pass test binaries or test names"
run = "cargo nextest run --all-features --profile ci"
watch = ["crates/**", "Cargo.toml", "Cargo.lock"]
timeout = 900

[targets.frontend]
about = "frontend vitest unit suite; pass test files, relative to frontend/"
cwd = "frontend"
run = "npx vitest run"
tests = ["frontend/src/**"]
timeout = 300

[checks.fmt]
about = "rustfmt (ci.sh's cargo fmt --all -- --check)"
run = "cargo fmt --all -- --check"
watch = ["crates/**", "Cargo.toml"]
files = false

[checks.clippy]
about = "clippy with warnings as errors (ci.sh's clippy step)"
run = "cargo clippy --all-targets --all-features -- -D warnings"
watch = ["crates/**", "Cargo.toml", "Cargo.lock"]
files = false
timeout = 900

[checks.typecheck]
about = "frontend TypeScript type check (npm run typecheck)"
cwd = "frontend"
run = "npm run typecheck"
watch = ["frontend/**"]
files = false
timeout = 300
